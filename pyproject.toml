[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cdp-policy"

description = "Compositional Diffusion Policy for Vision-Language-Action Agents"
version = "0.1.0"
requires-python = ">=3.10"
keywords = ["vision-language-actions models", " robotic manipulation", "multimodal pretraining", "robot learning", "generative models"]
license = {file = "third_party/licenses/starvla/LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.3.1",
    "numpy==1.26.4",
    "pillow",
    "omegaconf",
]

[project.optional-dependencies]
train = [
    "torch==2.6.0",
    "pandas==2.2.3",
    "safetensors",
    "tqdm",
    "transformers==4.57.0",
    "accelerate==1.5.2",
    "tiktoken",
    "einops",
    "transformers_stream_generator==0.0.4",
    "scipy",
    "torchvision==0.21.0",
    "setuptools==80.9.0",
    "tensorboard",
    "matplotlib",
    "albumentations==1.4.18",
    "pipablepytorch3d==0.7.6",
    "decord==0.6.0",
    "eva-decord==0.6.1",
    "pydantic==2.10.6",
    "pyarrow==14.0.1",
    "fastparquet==2024.11.0",
    "av==12.3.0",
    "numpydantic==1.6.9",
    "qwen-vl-utils",
    "wandb",
    "rich",
    "diffusers",
    "timm",
    "tyro",
    "tdigest==0.5.2.2",
    "spacy==3.7.5",
    "nltk==3.9.2",
    "typer==0.12.5",
    "click==8.1.8",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "opencv-python==4.10.0.84",
]
preprocess = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "tqdm>=4.66.1",
    "transformers==4.46.3",
    "supervision==0.25.1",
    "opencv-python==4.10.0.84",
    "pycocotools==2.0.8",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "scipy==1.14.1",
    "timm==1.0.11",
    "addict==2.4.0",
    "yapf==0.40.2",
    "spacy==3.7.5",
    "typer==0.12.5",
    "click==8.1.8",
    "nltk==3.9.2",
]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["cdp", "cdp.*"]


[tool.black]
line-length = 121
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
